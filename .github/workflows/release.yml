name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Run required tests
        run: bun run test:required

  build:
    name: Build Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all platform binaries
        run: bun run build:bin

      - name: Upload binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/binaries/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/binaries/

      - name: Generate checksums
        working-directory: dist/binaries
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum * > checksums.txt
          else
            shasum -a 256 * > checksums.txt
          fi

      - name: Verify checksums
        working-directory: dist/binaries
        run: |
          ls -la
          cat checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/binaries/mda-macos-arm64
            dist/binaries/mda-macos-x64
            dist/binaries/mda-linux-x64
            dist/binaries/mda-windows-x64.exe
            dist/binaries/checksums.txt
          generate_release_notes: false
          body: |
            ## md-anything ${{ github.ref_name }}

            Local-first Markdown conversion for files, URLs, and media — CLI and MCP server.

            ### Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ojspace/md-anything/main/install.sh | bash
            ```

            Or via Bun/npm (requires Bun ≥1.0):

            ```bash
            bun install -g md-anything
            npm install -g md-anything
            ```

            ### MCP setup

            ```bash
            mda mcp install claude        # Claude Desktop
            mda mcp install claude-code   # Claude Code CLI
            mda mcp install cursor        # Cursor
            mda mcp install windsurf      # Windsurf
            mda mcp install vscode        # VS Code / GitHub Copilot
            mda mcp install opencode      # OpenCode
            ```

            ### Binaries

            | Platform | File |
            |---|---|
            | macOS ARM64 (Apple Silicon) | `mda-macos-arm64` |
            | macOS x64 (Intel) | `mda-macos-x64` |
            | Linux x64 | `mda-linux-x64` |
            | Windows x64 | `mda-windows-x64.exe` |

            SHA-256 checksums: `checksums.txt`
          fail_on_unmatched_files: true
